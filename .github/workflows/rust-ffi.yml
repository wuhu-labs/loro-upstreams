name: rust-ffi
on:
  workflow_dispatch:
  pull_request:
    paths: [rust-ffi/**, .github/workflows/rust-ffi.yml]
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: bash rust-ffi/build.sh ${{ matrix.target }} "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/out/*.tar.gz
          if-no-files-found: error
